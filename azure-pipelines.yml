
trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
  # 1. Java 24 installieren
  - script: |
      wget https://download.java.net/java/GA/jdk24/1f9ff9062db4449d8ca828c504ffae90/36/GPL/openjdk-24_linux-x64_bin.tar.gz
      tar -xzf openjdk-24_linux-x64_bin.tar.gz
      echo "##vso[task.setvariable variable=JAVA_HOME]$(pwd)/jdk-24"
      echo "##vso[task.prependpath]$(pwd)/jdk-24/bin"
    displayName: 'Install Java 24'

  # 2. Maven Build
  - script: |
      java -version
      mvn -B clean package -DskipTests -f pom.xml
    displayName: 'Build & Test'
  - task: AzureCLI@2
    displayName: 'List Container Registries'
    inputs:
      azureSubscription: 'azure-sc-tourplanner'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az acr list --output table