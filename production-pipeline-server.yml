trigger:
  branches:
    include:
      - main

resources:
- repo: self

variables:
  tag: '$(Build.BuildId)'

stages:
  # Stage 1: Build & Test
  - stage: Build
    displayName: 'Build & Test'
    jobs:
      - job: BuildAndTest
        steps:
          - script: |
              wget -q https://download.java.net/java/GA/jdk24/1f9ff9062db4449d8ca828c504ffae90/36/GPL/openjdk-24_linux-x64_bin.tar.gz
              tar -xzf openjdk-24_linux-x64_bin.tar.gz
              echo "##vso[task.setvariable variable=JAVA_HOME]$(pwd)/jdk-24"
              echo "##vso[task.prependpath]$(pwd)/jdk-24/bin"
            displayName: 'Install Java 24'

          - script: |
              java -version
              mvn -B clean verify -f pom.xml
            displayName: 'Build, Test & Verify'

          # JAR als Artifact speichern für nächste Stage
          - publish: $(System.DefaultWorkingDirectory)/target
            artifact: jar-files
            displayName: 'Publish JAR Artifact'

  # Stage 2: Docker Build & Push
  - stage: Push
    displayName: 'Docker Build & Push'
    dependsOn: Build
    jobs:
      - job: DockerPush
        steps:
          # JAR von vorheriger Stage herunterladen
          - download: current
            artifact: jar-files
            displayName: 'Download JAR Artifact'

          - script: |
              mkdir -p target
              cp -r $(Pipeline.Workspace)/jar-files/* target/
            displayName: 'Restore JAR to target folder'

          - task: AzureCLI@2
            displayName: 'Docker Build and Push'
            inputs:
              azureSubscription: 'acr-tourplanner1'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az acr login --name $(registryName)
                
                docker build \
                  -t $(registryName).azurecr.io/$(imageRepository):$(tag) \
                  -t $(registryName).azurecr.io/$(imageRepository):latest \
                  -f $(dockerfilePath) .
                
                docker push $(registryName).azurecr.io/$(imageRepository):$(tag)
                docker push $(registryName).azurecr.io/$(imageRepository):latest

  # Stage 3: Deploy (nur Main)
  - stage: Deploy
    displayName: 'Deploy'
    dependsOn: Push
    jobs:
      - job: DeployJob
        steps:
          - task: AzureCLI@2
            displayName: 'Restart Container'
            inputs:
              azureSubscription: 'acr-tourplanner1'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Restarting container to pull latest image..."
                az container restart \
                  --name $(containerName) \
                  --resource-group $(resourceGroup)
                
                echo "Waiting for container to be ready..."
                az container show \
                  --name $(containerName) \
                  --resource-group $(resourceGroup) \
                  --query instanceView.state