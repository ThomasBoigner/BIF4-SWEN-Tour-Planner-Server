trigger:
  branches:
    include:
      - main
      - feature/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  registryName: 'tourplanner1'
  imageRepository: 'tourplanner-server'
  dockerfilePath: 'src/main/docker/Dockerfile'
  tag: '$(Build.BuildId)'
  isMain: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]

stages:
  # Stage 1: Immer ausführen (Feature + Main)
  - stage: Build
    displayName: 'Build & Test'
    jobs:
      - job: BuildAndTest
        steps:
          - script: |
              wget https://download.java.net/java/GA/jdk24/1f9ff9062db4449d8ca828c504ffae90/36/GPL/openjdk-24_linux-x64_bin.tar.gz
              tar -xzf openjdk-24_linux-x64_bin.tar.gz
              echo "##vso[task.setvariable variable=JAVA_HOME]$(pwd)/jdk-24"
              echo "##vso[task.prependpath]$(pwd)/jdk-24/bin"
            displayName: 'Install Java 24'

          - script: |
              java -version
              mvn -B clean test -f pom.xml
            displayName: 'Run Unit Tests'

          - script: |
              mvn -B package -DskipTests -f pom.xml
            displayName: 'Build JAR'

  # Stage 2: Nur auf Main
  - stage: Push
    displayName: 'Docker Build & Push'
    dependsOn: Build
    condition: and(succeeded(), eq(variables.isMain, true))
    jobs:
      - job: DockerPush
        steps:
          - script: |
              wget https://download.java.net/java/GA/jdk24/1f9ff9062db4449d8ca828c504ffae90/36/GPL/openjdk-24_linux-x64_bin.tar.gz
              tar -xzf openjdk-24_linux-x64_bin.tar.gz
              echo "##vso[task.setvariable variable=JAVA_HOME]$(pwd)/jdk-24"
              echo "##vso[task.prependpath]$(pwd)/jdk-24/bin"
            displayName: 'Install Java 24'

          - script: |
              mvn -B clean package -DskipTests -f pom.xml
            displayName: 'Build JAR'

          - task: AzureCLI@2
            displayName: 'Docker Build and Push'
            inputs:
              azureSubscription: 'acr-tourplanner1'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az acr login --name $(registryName)
                
                docker build -t $(registryName).azurecr.io/$(imageRepository):$(tag) -f $(dockerfilePath) .
                docker tag $(registryName).azurecr.io/$(imageRepository):$(tag) $(registryName).azurecr.io/$(imageRepository):latest
                
                docker push $(registryName).azurecr.io/$(imageRepository):$(tag)
                docker push $(registryName).azurecr.io/$(imageRepository):latest

 # Stage 3: Nur Main - Container neu starten
  - stage: Deploy
    displayName: 'Deploy'
    dependsOn: Push
    condition: and(succeeded(), eq(variables.isMain, true))
    jobs:
      - job: DeployJob
        displayName: 'Deploy Infrastructure and Restart Container'
        steps:

          # Step 1: Fetch Key Vault secrets
          - task: AzureCLI@2
            displayName: 'Fetch Key Vault Secrets'
            inputs:
              azureSubscription: 'tourplanner-kv-connection'   # Key Vault Service Connection
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                KEYVAULT_NAME="tourplanner-kv"
                
                # Fetch ACR password from Key Vault
                REGISTRY_PASSWORD=$(az keyvault secret show \
                    --vault-name $KEYVAULT_NAME \
                    --name acr-password \
                    --query value -o tsv)
                
                # Store it as a pipeline secret variable
                echo "##vso[task.setvariable variable=registryPassword;issecret=true]$REGISTRY_PASSWORD"

          # Step 2: Deploy Bicep with Key Vault secrets
          - task: AzureCLI@2
            displayName: 'Deploy Infrastructure with Bicep'
            inputs:
              azureSubscription: 'tourplanner-kv-connection'   # Same SP can deploy if it has access
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                RESOURCE_GROUP="tourplanner-rg"
                LOCATION="northeurope"
                BICEP_FILE="infra/main.bicep"
                REGISTRY_NAME="$(registryName)"
                REGISTRY_USERNAME="tourplanner"
                REGISTRY_PASSWORD="$(registryPassword)"
                KEYVAULT_NAME="tourplanner-kv"
                
                echo "Deploying infrastructure..."
                az deployment group create \
                  --resource-group $RESOURCE_GROUP \
                  --template-file $BICEP_FILE \
                  --parameters location=$LOCATION \
                               registryName=$REGISTRY_NAME \
                               registryUsername=$REGISTRY_USERNAME \
                               registryPassword=$REGISTRY_PASSWORD \
                               keyVaultName=$KEYVAULT_NAME

          # Step 3: Restart container to pull new image
          - task: AzureCLI@2
            displayName: 'Restart Container'
            inputs:
              azureSubscription: 'acr-tourplanner1'   # Docker/ACR service connection
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                RESOURCE_GROUP="tourplanner-rg"
                CONTAINER_GROUP="tourplanner-container"
                
                echo "Restarting container to pull latest image..."
                az container restart --name $CONTAINER_GROUP --resource-group $RESOURCE_GROUP